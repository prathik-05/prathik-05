<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid -->
    <pattern id="matrix-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Laser Gradients -->
    <linearGradient id="synapse-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Frame -->
  <rect width="860" height="220" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
  <rect width="860" height="220" rx="12" fill="url(#matrix-grid)"/>

  <!-- Top Header Bar -->
  <rect width="860" height="28" fill="#0D1117" rx="12"/>
  <rect y="24" width="860" height="4" fill="#0D1117"/>
  <circle cx="16" cy="14" r="4" fill="#FF5F56"/>
  <circle cx="30" cy="14" r="4" fill="#FFBD2E"/>
  <circle cx="44" cy="14" r="4" fill="#27C93F"/>
  <text x="60" y="18" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">PRATHIK-AI // LIVE NEURAL MATRIX &amp; MCP PIPELINE ENGINE</text>
  <text x="740" y="18" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">STATUS: ACTIVE ⚡</text>

  <!-- Laser Scanner Line Sweeping Horizontally -->
  <line x1="0" y1="28" x2="0" y2="220" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" filter="url(#cyan-glow)">
    <animate attributeName="x1" values="0;860;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;860;0" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Left Half: Interactive Neural Topology Diagram (x: 20 -> 480) -->
  <g transform="translate(30, 45)">
    <!-- Synaptic Path Lines -->
    <!-- Layer 1 -> Layer 2 -->
    <path d="M 40 40 L 140 20 M 40 40 L 140 60 M 40 100 L 140 60 M 40 100 L 140 100" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 40 40 L 140 20" stroke="url(#synapse-1)" stroke-width="2"/>
    <path d="M 40 100 L 140 100" stroke="url(#synapse-1)" stroke-width="2"/>

    <!-- Layer 2 -> Layer 3 (MCP Router Core) -->
    <path d="M 140 20 L 250 60 M 140 60 L 250 60 M 140 100 L 250 60" stroke="url(#synapse-1)" stroke-width="2"/>

    <!-- Layer 3 -> Layer 4 (Output Inference) -->
    <path d="M 250 60 L 360 30 M 250 60 L 360 90" stroke="url(#synapse-1)" stroke-width="2"/>

    <!-- Animated Pulse Energy Spheres Traveling Along Synapses -->
    <circle cx="40" cy="40" r="3.5" fill="#38BDF8" filter="url(#cyan-glow)">
      <animate attributeName="cx" values="40;140;250;360" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;20;60;30" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="100" r="3.5" fill="#10B981" filter="url(#emerald-glow)">
      <animate attributeName="cx" values="40;140;250;360" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;100;60;90" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="40" r="3" fill="#F43F5E">
      <animate attributeName="cx" values="40;140;250" dur="2.0s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;60;60" dur="2.0s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Layer 1 Nodes (Input Data Streams) -->
    <g transform="translate(40, 40)">
      <circle r="14" fill="#0D1117" stroke="#38BDF8" stroke-width="1.5" filter="url(#cyan-glow)"/>
      <text y="4" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="700">IN_1</text>
    </g>
    <g transform="translate(40, 100)">
      <circle r="14" fill="#0D1117" stroke="#10B981" stroke-width="1.5" filter="url(#emerald-glow)"/>
      <text y="4" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="9" font-weight="700">IN_2</text>
    </g>

    <!-- Layer 2 Nodes (RAG & Vision Processors) -->
    <g transform="translate(140, 20)">
      <circle r="15" fill="#0D1117" stroke="#818CF8" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" fill="#818CF8" font-family="monospace" font-size="8" font-weight="700">RAG</text>
    </g>
    <g transform="translate(140, 60)">
      <circle r="15" fill="#0D1117" stroke="#F59E0B" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="8" font-weight="700">YOLO</text>
    </g>
    <g transform="translate(140, 100)">
      <circle r="15" fill="#0D1117" stroke="#EC4899" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" fill="#EC4899" font-family="monospace" font-size="8" font-weight="700">EDA</text>
    </g>

    <!-- Layer 3 Node (MCP Router Core Engine - Rotating Outer Ring) -->
    <g transform="translate(250, 60)">
      <circle r="22" fill="#0D1117" stroke="#38BDF8" stroke-width="2" filter="url(#cyan-glow)"/>
      <circle r="18" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text y="4" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="700">MCP</text>
    </g>

    <!-- Layer 4 Nodes (Output Streams) -->
    <g transform="translate(360, 30)">
      <circle r="14" fill="#0D1117" stroke="#10B981" stroke-width="1.5" filter="url(#emerald-glow)"/>
      <text y="4" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="8" font-weight="700">OUT1</text>
    </g>
    <g transform="translate(360, 90)">
      <circle r="14" fill="#0D1117" stroke="#38BDF8" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="8" font-weight="700">OUT2</text>
    </g>
  </g>

  <!-- Right Half: Live Terminal Log Console (x: 440 -> 830) -->
  <g transform="translate(440, 42)">
    <rect width="395" height="155" rx="8" fill="#0D1117" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Console Title Bar -->
    <rect width="395" height="22" rx="8" fill="#161B22"/>
    <text x="12" y="15" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">&gt;_ CONSOLE_STREAM (LOGS)</text>

    <!-- Scrolling Typewriter Terminal Log Lines -->
    <g transform="translate(12, 38)">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1;0" dur="4s" repeatCount="indefinite"/>
        <text y="0" fill="#10B981" font-family="monospace" font-size="10">[0.012s] INIT_MCP_AGENT --router=active</text>
        <text y="20" fill="#38BDF8" font-family="monospace" font-size="10">[0.024s] RAG_SEARCH: 512 chunks embedded</text>
        <text y="40" fill="#F59E0B" font-family="monospace" font-size="10">[0.038s] YOLOv11_VISION: 60 FPS segmenting</text>
        <text y="60" fill="#818CF8" font-family="monospace" font-size="10">[0.052s] COGNITO_EDA: report generated</text>
        <text y="80" fill="#EC4899" font-family="monospace" font-size="10">[0.065s] OCI_GENAI: prompt stream ready</text>
        <text y="100" fill="#38BDF8" font-family="monospace" font-size="10">[0.078s] PIPELINE_SYNC: 0 errors --OK</text>
      </g>
    </g>
  </g>
</svg>